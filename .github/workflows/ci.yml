name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify dist output
        run: test -f dist/index.html && test -d dist/assets

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    env:
      # Required so importing `claude_service` instantiates Gemini client in CI (no real calls).
      GEMINI_API_KEY: ci-placeholder-for-import-only
      RESEND_API_KEY: ci-placeholder-for-import-only
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q backend

      - name: Import FastAPI application
        working-directory: backend
        run: python -c "from main import app; assert app.title == 'ManiOS Backend'"
